version: '3'
services:
  app:
    build: .
    restart: always
    ports:
      - "8000:8000"
    command: sh -c "sleep 10s ; gunicorn -w4 -b 0.0.0.0:8000 app:app -D"
    env_file:
      - src/.env
    depends_on:
      - mysql

  mysql:
    image: docker.io/mysql:latest
    env_file:
      - src/.env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "mysql"]
      timeout: 10s
      retries: 5
    hostname: mysql

volumes:
  mysql_data:
