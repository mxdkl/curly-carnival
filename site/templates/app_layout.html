<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eve's Login</title>
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.svg') }}" />

</head>
<body>
<nav class="navbar fixed-top bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand ps-4" href="#">
            <img src="../static/images/favicon.svg" alt="Persona Corps" />
        </a>
        <div class="nav justify-content-end">
            <a class="nav-link" href="#"><i class="bi bi-search"></i></a>
            <a class="nav-link" href="#"><i class="bi bi-gear"></i></a>
            <a class="nav-link" href="#"><i class="bi bi-person-circle"></i></a>
        </div>
    </div>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
