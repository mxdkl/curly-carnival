<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eve's Login</title>
    <link rel="shortcut icon" type="image/x-icon" href="../static/images/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../static/css/app-main.css" />
</head>
<body>
<nav class="navbar fixed-top bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand ps-4" href="#">
            <img src="../static/images/favicon.svg" alt="Persona Corps" />
        </a>
        <div class="nav justify-content-end">
            <a class="nav-link" href="#"><i class="bi bi-search"></i></a>
            <a class="nav-link" href="#"><i class="bi bi-gear"></i></a>
            <a class="nav-link" href="#"><i class="bi bi-person-circle"></i></a>
        </div>
    </div>
</nav>
<main class="container">
    <form class="d-grid gap-2">
        <div>
            <a class="no-underline" href="#"><i class="bi bi-fonts"></i></a>
            <a class="no-underline" href="#"><i class="bi bi-three-dots-vertical"></i></a>
            <a class="no-underline" href="#"><i class="bi bi-paperclip"></i></a>
            <button class="btn btn-outline-primary" type="submit"><i class="bi bi-send"></i>Send</button>
        </div>
        <div class="form-floating mb-1">
            <input type="email" class="form-control" id="toInput" placeholder="name@example.com">
            <label for="toInput">To</label>
            <a class="no-underline" href="#">CC/BCC</a>
        </div>
        <div class="form-floating mb-1">
            <input type="email" class="form-control" id="ccInput" placeholder="name@example.com">
            <label for="toInput">CC</label>
        </div>
        <div class="form-floating mb-1">
            <input type="email" class="form-control" id="ccInput" placeholder="name@example.com">
            <label for="toInput">BCC</label>
        </div>
        <div class="form-floating">
            <input type="email" class="form-control" id="subjectInput" placeholder="name@example.com">
            <label for="subjectInput">Subject</label>
        </div>
        <hr />
        <span role="textbox" class="form-control textarea" contenteditable="true" aria-multiline="true" aria-required="true"></span>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
